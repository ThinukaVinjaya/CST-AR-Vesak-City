<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.92); color: #fff; z-index: 20; gap: 14px;
        text-align: center; padding: 32px;
      }
      #loading .title { font-size: 24px; font-weight: bold; color: #ffd580; letter-spacing: 1px; }
      #loading .sub   { font-size: 13px; color: #bbb; line-height: 1.7; }
      #loading .hint  { font-size: 11px; color: #888; margin-top: 6px; }

      #statusBar {
        position: fixed; bottom: 24px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(8px);
        color: #fff; font-size: 13px;
        padding: 10px 20px; border-radius: 24px;
        z-index: 6; display: none;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.12);
        transition: opacity 0.4s;
        max-width: 88vw; white-space: normal;
      }

      #ringWrap {
        position: fixed;
        bottom: 26%; left: 50%;
        transform: translateX(-50%);
        width: 110px; height: 110px;
        display: none; z-index: 5;
        pointer-events: none;
      }
      #ringWrap svg { width: 100%; height: 100%; }
      #ringBg  { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 5; }
      #ringFill{ fill: none; stroke: #00ffcc; stroke-width: 5;
                 stroke-linecap: round;
                 stroke-dasharray: 283; stroke-dashoffset: 283;
                 transform: rotate(-90deg); transform-origin: 50% 50%;
                 transition: stroke-dashoffset 0.25s ease; }
      #ringPct { fill: #fff; font-size: 18px; font-weight: 600;
                 text-anchor: middle; dominant-baseline: central; }

      #nightBadge {
        position: fixed; top: 14px; right: 14px;
        background: rgba(255,180,30,0.18);
        border: 1px solid rgba(255,180,30,0.4);
        color: #ffc84a; font-size: 12px;
        padding: 5px 11px; border-radius: 14px;
        z-index: 7; display: none;
      }

      #placedTick {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%,-50%) scale(0);
        background: rgba(0,200,120,0.22);
        border: 2px solid #00d484;
        border-radius: 50%; width: 72px; height: 72px;
        display: flex; align-items: center; justify-content: center;
        color: #00d484; font-size: 32px;
        z-index: 8; pointer-events: none;
        transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.5s;
        opacity: 0;
      }

      #modelProgress {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        border: 1px solid rgba(255,200,80,0.3);
        border-radius: 16px;
        color: #ffd580; font-size: 13px;
        padding: 18px 28px; text-align: center;
        z-index: 15; display: none;
        backdrop-filter: blur(10px);
        min-width: 200px;
      }
      #modelProgress .prog-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
      #modelProgress .prog-bar-wrap { background: rgba(255,255,255,0.1); border-radius: 8px; height: 6px; overflow: hidden; margin-top: 8px; }
      #modelProgress .prog-bar { height: 100%; background: linear-gradient(90deg,#ffd580,#ff9933); border-radius: 8px; width: 0%; transition: width 0.3s; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="title">🪷 AR Vesak City</div>
      <div class="sub">Loading realistic models…<br>Please wait a moment.</div>
      <div class="hint">Tap "Start AR" then point your camera at the floor.</div>
    </div>

    <div id="modelProgress">
      <div class="prog-title">📦 Loading Models</div>
      <div id="progText">0 / 6</div>
      <div class="prog-bar-wrap"><div class="prog-bar" id="progBar"></div></div>
    </div>

    <div id="ringWrap">
      <svg viewBox="0 0 100 100">
        <circle id="ringBg"   cx="50" cy="50" r="45"/>
        <circle id="ringFill" cx="50" cy="50" r="45"/>
        <text   id="ringPct"  x="50"  y="50">0%</text>
      </svg>
    </div>
    <div id="statusBar"></div>
    <div id="nightBadge">🌙 Night mode</div>
    <div id="placedTick">✓</div>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
      import { ARButton }    from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';
      import { GLTFLoader }  from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/DRACOLoader.js';

      // ── DOM ──────────────────────────────────────────────────────────────────
      const elStatus   = document.getElementById('statusBar');
      const elRing     = document.getElementById('ringWrap');
      const elRingFill = document.getElementById('ringFill');
      const elRingPct  = document.getElementById('ringPct');
      const elNight    = document.getElementById('nightBadge');
      const elTick     = document.getElementById('placedTick');
      const elMProg    = document.getElementById('modelProgress');
      const elProgText = document.getElementById('progText');
      const elProgBar  = document.getElementById('progBar');

      // ── Model URLs ───────────────────────────────────────────────────────────
      const BASE = 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/';
      const MODELS = {
        buddha:       BASE + 'stone_buddha_statue.glb',
        lotus1:       BASE + 'lotus1.glb',
        lotus2:       BASE + 'lotus_flower2.glb',
        lotusLantern: BASE + 'lotus_lanttern.glb',
        vesakLantern: 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/vesak_lanterns.glb',
        stupa:        BASE + 'sthupa_srilanka.glb',
      };

      // ── Config ───────────────────────────────────────────────────────────────
      const CIRCUM       = 2 * Math.PI * 45;
      const FRAMES_DAY   = 18;
      const FRAMES_NIGHT = 5;
      const DRIFT_DAY    = 0.06;
      const DRIFT_NIGHT  = 0.18;
      const FALLBACK_MS  = 3500;

      // ── State ────────────────────────────────────────────────────────────────
      let camera, scene, renderer, reticle;
      let hitTestSource = null, hitTestSourceRequested = false;
      let placed = false, sessionStartTime = null;
      let stableCount = 0;
      const lastHitPos = new THREE.Vector3();
      let isNightMode = false;

      const flyingLanterns = [], pathLights = [], particleGroups = [];
      const loadedModels = {};

      let videoEl = null, brightnessCanvas = null, brightnessCtx = null;

      // ── GLTF Loader ──────────────────────────────────────────────────────────
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      // ── Preload all models ───────────────────────────────────────────────────
      async function preloadModels() {
        const keys = Object.keys(MODELS);
        const total = keys.length;
        let done = 0;
        elMProg.style.display = 'block';

        const promises = keys.map(key =>
          new Promise((resolve) => {
            gltfLoader.load(
              MODELS[key],
              (gltf) => {
                loadedModels[key] = gltf.scene;
                done++;
                elProgText.textContent = `${done} / ${total}`;
                elProgBar.style.width  = `${(done/total)*100}%`;
                resolve();
              },
              undefined,
              (err) => {
                console.warn(`Failed to load ${key}:`, err);
                done++;
                elProgText.textContent = `${done} / ${total}`;
                elProgBar.style.width  = `${(done/total)*100}%`;
                resolve(); // don't block on error
              }
            );
          })
        );

        await Promise.all(promises);
        elMProg.style.display = 'none';
        document.querySelector('#loading .sub').textContent = 'Models ready! Tap "Start AR" below.';
      }

      // ── Clone helper (reuse loaded model) ───────────────────────────────────
      function cloneModel(key, scale = 1) {
        if (!loadedModels[key]) return new THREE.Group();
        const clone = loadedModels[key].clone(true);
        clone.scale.setScalar(scale);
        clone.traverse(n => {
          if (n.isMesh) {
            n.castShadow    = true;
            n.receiveShadow = true;
          }
        });
        return clone;
      }

      // ── Fit model to target size helper ─────────────────────────────────────
      function fitModel(key, targetSize) {
        const m = cloneModel(key, 1);
        const box = new THREE.Box3().setFromObject(m);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const s = maxDim > 0 ? targetSize / maxDim : 1;
        m.scale.setScalar(s);
        // re-center at bottom
        const box2 = new THREE.Box3().setFromObject(m);
        const center = box2.getCenter(new THREE.Vector3());
        m.position.sub(center);
        m.position.y += box2.getSize(new THREE.Vector3()).y / 2;
        return m;
      }

      // ── Light sensor ─────────────────────────────────────────────────────────
      function startBrightnessSensor() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          .then(stream => {
            videoEl = document.createElement('video');
            videoEl.srcObject = stream; videoEl.playsInline = true;
            videoEl.muted = true; videoEl.play();
            brightnessCanvas = document.createElement('canvas');
            brightnessCanvas.width = 32; brightnessCanvas.height = 32;
            brightnessCtx = brightnessCanvas.getContext('2d', { willReadFrequently: true });
            setInterval(measureBrightness, 1200);
          }).catch(() => {});
      }

      function measureBrightness() {
        if (!videoEl || videoEl.readyState < 2) return;
        brightnessCtx.drawImage(videoEl, 0, 0, 32, 32);
        const d = brightnessCtx.getImageData(0, 0, 32, 32).data;
        let lum = 0;
        for (let i = 0; i < d.length; i += 4)
          lum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        lum /= (32*32);
        const night = lum < 60;
        if (night !== isNightMode) { isNightMode = night; elNight.style.display = night ? 'block' : 'none'; }
      }

      // ── Init ─────────────────────────────────────────────────────────────────
      await preloadModels();
      init();
      startLoop();

      function init() {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        Object.assign(renderer.domElement.style, { position:'absolute', top:'0', left:'0', width:'100%', height:'100%' });
        document.body.appendChild(renderer.domElement);

        scene  = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

        // Lighting — warm ceremonial mood
        const hemi = new THREE.HemisphereLight(0xffe4b5, 0x664422, 1.2); scene.add(hemi);
        const dir  = new THREE.DirectionalLight(0xfff8e0, 0.8);
        dir.position.set(3, 8, 4);
        dir.castShadow = true;
        dir.shadow.mapSize.set(1024, 1024);
        scene.add(dir);
        const amb = new THREE.AmbientLight(0xffd580, 0.4); scene.add(amb);

        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.08, 0.12, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.85 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        document.body.appendChild(
          ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] })
        );

        renderer.xr.addEventListener('sessionstart', () => {
          document.getElementById('loading').style.display = 'none';
          sessionStartTime = performance.now();
          showStatus('🔍 Aim at the floor ahead…');
          elRing.style.display = 'block';
          startBrightnessSensor();
        });
        renderer.xr.addEventListener('sessionend', () => {
          hitTestSourceRequested = false; hitTestSource = null;
          placed = false; stableCount = 0; sessionStartTime = null;
        });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setTimeout(() => {
          const l = document.getElementById('loading');
          if (l) l.style.display = 'none';
        }, 800);
      }

      function showStatus(msg) {
        elStatus.textContent = msg;
        elStatus.style.display = 'block';
        elStatus.style.opacity = '1';
      }
      function hideStatus() {
        elStatus.style.opacity = '0';
        setTimeout(() => elStatus.style.display = 'none', 400);
      }
      function setRing(pct) {
        const offset = CIRCUM * (1 - pct / 100);
        elRingFill.style.strokeDashoffset = offset;
        elRingPct.textContent = Math.round(pct) + '%';
        const hue = pct < 50 ? 174 : 174 + (pct - 50) * 1.8;
        elRingFill.style.stroke = `hsl(${hue},100%,55%)`;
      }

      // ── Main loop ────────────────────────────────────────────────────────────
      function startLoop() { renderer.setAnimationLoop(render); }

      function render(timestamp, frame) {
        if (frame) {
          const session      = renderer.xr.getSession();
          const refSpace     = renderer.xr.getReferenceSpace();

          if (!hitTestSourceRequested && session) {
            session.requestReferenceSpace('viewer').then(rs => {
              session.requestHitTestSource({ space: rs }).then(src => { hitTestSource = src; });
            });
            hitTestSourceRequested = true;
          }

          if (!placed) {
            const maxFrames = isNightMode ? FRAMES_NIGHT : FRAMES_DAY;
            const maxDrift  = isNightMode ? DRIFT_NIGHT  : DRIFT_DAY;
            let gotHit = false;

            if (hitTestSource) {
              const results = frame.getHitTestResults(hitTestSource);
              if (results.length > 0) {
                const pose = results[0].getPose(refSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);

                const hitPos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                const drift  = hitPos.distanceTo(lastHitPos);

                if (drift < maxDrift) stableCount++;
                else stableCount = isNightMode ? Math.max(0, stableCount - 1) : 0;
                lastHitPos.copy(hitPos);
                gotHit = true;

                const pct = Math.min(100, (stableCount / maxFrames) * 100);
                setRing(pct);
                const label = isNightMode ? '🌙 Night mode — detecting floor…' : '🔍 Detecting floor…';
                showStatus(label + '  ' + Math.round(pct) + '%');

                if (stableCount >= maxFrames) placeCity('hittest');
              } else {
                reticle.visible = false;
                stableCount = isNightMode ? Math.max(0, stableCount - 1) : 0;
                setRing(Math.min(100, (stableCount / maxFrames) * 100));
                showStatus('📱 Point camera at the floor…');
              }
            }

            if (!gotHit && sessionStartTime !== null) {
              if (performance.now() - sessionStartTime > FALLBACK_MS) placeCity('fallback');
            }
          }
        }

        animateLanterns(timestamp);
        animateLights(timestamp);
        animateParticles(timestamp);
        renderer.render(scene, camera);
      }

      // ── Place city ───────────────────────────────────────────────────────────
      function placeCity(method) {
        placed = true;
        reticle.visible = false;
        elRing.style.display = 'none';

        const world = new THREE.Group();

        if (method === 'hittest') {
          world.position.setFromMatrixPosition(reticle.matrix);
          const m = reticle.matrix.elements;
          world.rotation.y = Math.atan2(m[8], m[10]);
        } else {
          const camPos = new THREE.Vector3();
          const camDir = new THREE.Vector3();
          camera.getWorldPosition(camPos);
          camera.getWorldDirection(camDir);
          camDir.y = 0;
          if (camDir.lengthSq() < 0.001) camDir.set(0, 0, -1);
          camDir.normalize();
          const floorY = camPos.y - 1.6;
          world.position.set(camPos.x + camDir.x * 1.5, floorY, camPos.z + camDir.z * 1.5);
          world.rotation.y = Math.atan2(camDir.x, camDir.z) + Math.PI;
        }

        scene.add(world);
        buildCity(world);

        elTick.style.transform = 'translate(-50%,-50%) scale(1)';
        elTick.style.opacity   = '1';
        setTimeout(() => {
          elTick.style.opacity = '0';
          elTick.style.transform = 'translate(-50%,-50%) scale(0.8)';
        }, 1200);

        showStatus('🪷 Vesak City placed' + (method === 'fallback' ? ' (floor estimated)' : ''));
        setTimeout(hideStatus, 2800);
      }

      // ── Build City ───────────────────────────────────────────────────────────
      /*
        Layout (top-down, Z goes away from viewer):
        Left side  (x < 0) : Buddha statue
        Right side (x > 0) : Stupa
        Center back         : Vesak lanterns arch between them
        Lotus path          : Along Z axis centre (between -2 to -12)
        Lotus lanterns      : Placed near back / sides for depth
        Flying sky lanterns : Rising above the scene
        Garden lights       : Scattered warm orbs
        Fireflies           : Ambient particles
      */
      function buildCity(world) {
        addFloorDeco(world);
        addLotusPath(world);
        addBuddhaStatue(world);
        addStupa(world);
        addVesakLanterns(world);
        addLotusLanterns(world);
        addPathPoles(world);
        addFlyingLanterns(world, 16);
        addGardenLights(world);
        addFireflyGlow(world);
      }

      // Subtle glowing ground disc to anchor the scene
      function addFloorDeco(parent) {
        const geo = new THREE.CircleGeometry(4.5, 64).rotateX(-Math.PI/2);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffd580, transparent: true, opacity: 0.05, side: THREE.DoubleSide });
        parent.add(new THREE.Mesh(geo, mat));

        // Mandala ring
        for (let r = 1; r <= 3; r++) {
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(r * 1.1, r * 1.1 + 0.02, 64).rotateX(-Math.PI/2),
            new THREE.MeshBasicMaterial({ color: 0xffc84a, transparent: true, opacity: 0.12, side: THREE.DoubleSide })
          );
          parent.add(ring);
        }
      }

      // ── Buddha Statue — left side ─────────────────────────────────────────
      function addBuddhaStatue(parent) {
        const m = fitModel('buddha', 1.8);
        m.position.set(-2.5, 0, -5);
        m.rotation.y = Math.PI * 0.15; // slight angle toward center
        parent.add(m);

        // Halo ring behind head
        const halo = new THREE.Mesh(
          new THREE.RingGeometry(0.55, 0.65, 40),
          new THREE.MeshBasicMaterial({ color: 0xffe070, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
        );
        halo.position.set(-2.5, 2.1, -5.05);
        halo.rotation.x = -0.1;
        parent.add(halo);

        // Offering light beneath
        const offerLight = new THREE.PointLight(0xffd580, 1.2, 3.5);
        offerLight.position.set(-2.5, 0.3, -5);
        parent.add(offerLight);
        pathLights.push({ light: offerLight, phase: 0.5 });

        // Small incense glow
        const incense = new THREE.Mesh(
          new THREE.SphereGeometry(0.05, 8, 8),
          new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0xff8800, emissiveIntensity: 2, transparent: true, opacity: 0.9 })
        );
        incense.position.set(-2.5, 0.6, -4.5);
        parent.add(incense);
      }

      // ── Stupa — right side ────────────────────────────────────────────────
      function addStupa(parent) {
        const m = fitModel('stupa', 2.2);
        m.position.set(2.8, 0, -5.5);
        m.rotation.y = -Math.PI * 0.1;
        parent.add(m);

        // Ambient glow around stupa base
        const stupaLight = new THREE.PointLight(0xfff8cc, 1.0, 4);
        stupaLight.position.set(2.8, 0.5, -5.5);
        parent.add(stupaLight);
        pathLights.push({ light: stupaLight, phase: 1.2 });

        // Pinnacle glow
        const pinnacle = new THREE.PointLight(0xffeeaa, 0.6, 2);
        pinnacle.position.set(2.8, 2.5, -5.5);
        parent.add(pinnacle);
        pathLights.push({ light: pinnacle, phase: 2.1 });
      }

      // ── Vesak Lanterns — between Buddha and Stupa, center-back ───────────
      function addVesakLanterns(parent) {
        // Main large lantern cluster center
        const positions = [
          [0,   0, -7.5],
          [-1,  0, -8.5],
          [1,   0, -8.5],
          [-0.5,0, -6.5],
          [0.5, 0, -6.5],
          [0,   0, -9.5],
        ];
        positions.forEach(([x, y, z], i) => {
          const m = fitModel('vesakLantern', 0.5 + (i === 0 ? 0.3 : 0));
          m.position.set(x, y, z);
          m.rotation.y = (Math.random() - 0.5) * 0.5;
          parent.add(m);

          const l = new THREE.PointLight(0xff6633, 0.9, 3);
          l.position.set(x, y + 0.5, z);
          parent.add(l);
          pathLights.push({ light: l, phase: i * 0.8 });
        });

        // String of lights between Buddha and Stupa
        for (let i = 0; i <= 10; i++) {
          const t = i / 10;
          const x = -2.5 + t * 5.3;
          const y = 2.0 - Math.sin(t * Math.PI) * 0.3; // slight droop
          const z = -5 - t * 0.5;
          const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.05, 6, 6),
            new THREE.MeshStandardMaterial({ color: 0xff9933, emissive: 0xff6600, emissiveIntensity: 2.5, transparent: true, opacity: 0.95 })
          );
          bulb.position.set(x, y, z);
          parent.add(bulb);
        }
      }

      // ── Lotus Path — central walkway ──────────────────────────────────────
      function addLotusPath(parent) {
        // Alternate between lotus1 and lotus2 along the central path
        for (let i = 0; i < 9; i++) {
          const key = i % 2 === 0 ? 'lotus1' : 'lotus2';
          const size = 0.18 + Math.random() * 0.12;
          const m = fitModel(key, size);
          const side = i % 2 === 0 ? -0.55 : 0.55;
          m.position.set(side + (Math.random()-0.5)*0.15, 0.02, -1.5 - i * 1.1 + (Math.random()-0.5)*0.2);
          m.rotation.y = Math.random() * Math.PI * 2;
          parent.add(m);
        }

        // Scattered lotus clusters on sides
        const clusterPos = [
          [-1.8, 0, -3], [1.8, 0, -3],
          [-2.2, 0, -6], [2.2, 0, -6],
          [-1.5, 0, -9], [1.5, 0, -9],
          [-3.0, 0, -4.5],[3.0, 0, -4.5],
        ];
        clusterPos.forEach(([x, y, z], idx) => {
          const key = idx % 2 === 0 ? 'lotus1' : 'lotus2';
          const n = 2 + Math.floor(Math.random() * 3);
          for (let j = 0; j < n; j++) {
            const a = (j / n) * Math.PI * 2;
            const m = fitModel(key, 0.12 + Math.random() * 0.08);
            m.position.set(x + Math.cos(a)*0.35, 0.02, z + Math.sin(a)*0.35);
            m.rotation.y = Math.random() * Math.PI * 2;
            parent.add(m);
          }
        });
      }

      // ── Lotus Lanterns — end of city, side accents ────────────────────────
      function addLotusLanterns(parent) {
        const spots = [
          [-1.2, 0, -10.5],
          [ 1.2, 0, -10.5],
          [-2.5, 0,  -8.5],
          [ 2.5, 0,  -8.5],
          [-0.5, 0, -11.5],
          [ 0.5, 0, -11.5],
          [-3.5, 0,  -3.5],
          [ 3.5, 0,  -3.5],
        ];
        spots.forEach(([x, y, z], i) => {
          const m = fitModel('lotusLantern', 0.32);
          m.position.set(x, y, z);
          m.rotation.y = Math.random() * Math.PI * 2;
          parent.add(m);

          const l = new THREE.PointLight(0xffccaa, 0.7, 2.5);
          l.position.set(x, y + 0.3, z);
          parent.add(l);
          pathLights.push({ light: l, phase: i * 0.6 + 1 });
        });
      }

      // ── Decorative path poles with lanterns ───────────────────────────────
      function addPathPoles(parent) {
        const sides = [-1.2, 1.2];
        for (let i = 0; i < 7; i++) {
          sides.forEach(sx => {
            const poleZ = -1.5 - i * 1.6;
            const pole = new THREE.Mesh(
              new THREE.CylinderGeometry(0.03, 0.04, 2.0, 8),
              new THREE.MeshStandardMaterial({ color: 0x7a4a20, roughness: 0.8 })
            );
            pole.position.set(sx, 1.0, poleZ);
            parent.add(pole);

            // Simple glowing ball on top
            const ball = new THREE.Mesh(
              new THREE.SphereGeometry(0.09, 10, 10),
              new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0xff8800, emissiveIntensity: 1.5, transparent: true, opacity: 0.92 })
            );
            ball.position.set(sx, 2.05, poleZ);
            parent.add(ball);

            const pl = new THREE.PointLight(0xffa040, 0.6, 2.2);
            pl.position.set(sx, 2.0, poleZ);
            parent.add(pl);
            pathLights.push({ light: pl, phase: Math.random() * Math.PI * 2 });
          });
        }
      }

      // ── Flying sky lanterns ───────────────────────────────────────────────
      function addFlyingLanterns(parent, count) {
        for (let i = 0; i < count; i++) {
          const l = createSkyLantern();
          l.position.set((Math.random()-0.5)*7, 0.5 + Math.random()*0.5, -1.5-Math.random()*9);
          l.userData = {
            speed:  0.012 + Math.random()*0.018,
            driftX: (Math.random()-0.5)*0.0015,
            driftZ: -0.0012 - Math.random()*0.001,
            phase:  Math.random()*Math.PI*2
          };
          flyingLanterns.push(l);
          parent.add(l);
        }
      }

      function createSkyLantern() {
        const g = new THREE.Group();
        const balloon = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 12, 10),
          new THREE.MeshStandardMaterial({ color: 0xffeb99, emissive: 0xffd36b, emissiveIntensity: 1.4, transparent: true, opacity: 0.88 })
        );
        balloon.scale.set(1, 1.35, 1); g.add(balloon);

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.15, 0.022, 8, 24),
          new THREE.MeshStandardMaterial({ color: 0x7a4a2c })
        );
        ring.rotation.x = Math.PI/2; ring.position.y = -0.26; g.add(ring);

        const flame = new THREE.Mesh(
          new THREE.ConeGeometry(0.055, 0.18, 8),
          new THREE.MeshStandardMaterial({ color: 0xffa533, emissive: 0xff7700, emissiveIntensity: 3.5 })
        );
        flame.position.y = -0.18; flame.rotation.x = Math.PI; g.add(flame);

        g.add(new THREE.PointLight(0xffb060, 1.2, 5));
        return g;
      }

      // ── Garden ambient orbs ───────────────────────────────────────────────
      function addGardenLights(parent) {
        const spots = [
          [-1.8, 0.4, -1.5],[1.8, 0.4, -1.5],
          [-3.2, 0.4, -4.5],[3.2, 0.4, -4.5],
          [-1.5, 0.4, -7.5],[1.5, 0.4, -7.5],
          [-2.0, 0.4,-10.0],[2.0, 0.4,-10.0],
          [0, 0.4, -1.0],
        ];
        spots.forEach(([x, y, z], i) => {
          const orb = new THREE.Mesh(
            new THREE.SphereGeometry(0.09, 10, 10),
            new THREE.MeshStandardMaterial({ color: 0xffd580, emissive: 0xffd150, emissiveIntensity: 1.1, transparent: true, opacity: 0.9 })
          );
          orb.position.set(x, y, z); parent.add(orb);
          const l = new THREE.PointLight(0xffd580, 0.65, 3);
          l.position.set(x, y, z); parent.add(l);
          pathLights.push({ light: l, phase: i * 0.4 + 0.2 });
        });
      }

      // ── Firefly particles ─────────────────────────────────────────────────
      function addFireflyGlow(parent) {
        const g = new THREE.Group();
        for (let i = 0; i < 30; i++) {
          const f = new THREE.Mesh(
            new THREE.SphereGeometry(0.035, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0xffe7aa, emissive: 0xffd680, emissiveIntensity: 1.5, transparent: true, opacity: 0.9 })
          );
          f.position.set((Math.random()-0.5)*8, 0.15+Math.random()*1.8, -0.5-Math.random()*10);
          g.add(f);
        }
        parent.add(g);
        particleGroups.push(g);
      }

      // ── Animations ────────────────────────────────────────────────────────
      function animateLanterns(t) {
        flyingLanterns.forEach(l => {
          l.position.y += l.userData.speed;
          l.position.x += l.userData.driftX + Math.sin(t*0.001+l.userData.phase)*0.0007;
          l.position.z += l.userData.driftZ;
          l.rotation.y += 0.003;
          l.rotation.z  = Math.sin(t*0.001+l.userData.phase)*0.05;
          if (l.position.y > 12) {
            l.position.y = 0.6;
            l.position.x = (Math.random()-0.5)*7;
            l.position.z = -1.5-Math.random()*9;
          }
        });
      }
      function animateLights(t) {
        pathLights.forEach(({light,phase}) => {
          light.intensity = 0.55 + 0.28*Math.sin(t*0.006+phase);
          light.color.setHSL(0.09, 0.9, 0.52+0.12*Math.sin(t*0.01+phase));
        });
      }
      function animateParticles(t) {
        particleGroups.forEach((g, idx) => {
          g.children.forEach((p, i) => {
            p.position.y += 0.0018 + 0.001*idx;
            p.position.x += Math.sin(t*0.0007+i)*0.0006;
            p.material.opacity = 0.5 + 0.5*Math.sin(t*0.002+i);
            if (p.position.y > 2.5) p.position.y = 0.15;
          });
        });
      }
    </script>
  </body>
</html>
